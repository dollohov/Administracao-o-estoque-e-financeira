{% extends "base.html" %}

{% block title %}Cadastrar Produto (Fiscal) - Gestão ERP{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Cadastrar Novo Produto (Módulo Fiscal)</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="preco_custo" class="form-label">Preço de Custo (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="preco_custo" name="preco_custo" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="preco_venda" class="form-label">Preço de Venda (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="preco_venda" name="preco_venda" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="estoque_inicial" class="form-label">Estoque Inicial</label>
                                <input type="number" class="form-control" id="estoque_inicial" name="estoque_inicial" value="0">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="estoque_minimo" class="form-label">Estoque Mínimo</label>
                                <input type="number" class="form-control" id="estoque_minimo" name="estoque_minimo" value="10">
                            </div>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="{% url 'fiscal:dashboard' %}" class="btn btn-secondary me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar Produto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
