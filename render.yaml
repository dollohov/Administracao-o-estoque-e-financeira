services:
  - type: web
    name: erp-telegram-secure
    env: node
    region: us-east-1
    plan: starter
    
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: VITE_APP_TITLE
        value: "Gestão ERP + Telegram Seguro"
      - key: VITE_APP_LOGO
        value: ""
    
    # Database connection (configure no dashboard do Render)
    # - key: DATABASE_URL
    #   fromDatabase:
    #     name: erp-db
    #     property: connectionString
    
    autoDeploy: true
    
    # Health check
    healthCheckPath: /
    healthCheckInterval: 30
    healthCheckTimeout: 10

# Opcional: Adicionar banco de dados PostgreSQL
# databases:
#   - name: erp-db
#     engine: postgres
#     version: 15
#     plan: free
